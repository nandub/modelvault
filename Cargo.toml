[package]
name = "modelvault"
version = "1.7.0"
edition = "2021"
rust-version = "1.94.1"
description = "Tensor-aware content-addressed storage for AI artifacts"
license = "Apache-2.0 OR MIT"

[features]
default = ["compression"]
compression = ["dep:zstd"]
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:tokio"]
signing = ["dep:base64", "dep:ed25519-dalek", "dep:rand_core"]

[dependencies]
anyhow = "1"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
memmap2 = "0.9"
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fastcdc = "4.0.1"
zstd = { version = "0.13", optional = true }
aws-config = { version = "=1.11.0", optional = true }
aws-sdk-s3 = { version = "=1.144.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"], optional = true }
base64 = { version = "0.22", optional = true }
ed25519-dalek = { version = "2.2", features = ["rand_core"], optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0
