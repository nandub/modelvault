name: Release artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/modelvault
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: target/aarch64-unknown-linux-gnu/release/modelvault
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/modelvault.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/modelvault
          - os: macos-14
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/modelvault
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@a54c7afa936fefeb4456b2dd8068152669aa8203 # v1
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2
      - name: Verify release version metadata
        shell: pwsh
        run: ./scripts/release/Verify-ReleaseVersion.ps1 -ReleaseTag $env:RELEASE_TAG
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify release binary
        shell: pwsh
        run: ./scripts/release/Verify-ReleaseBinary.ps1 -ReleaseTag $env:RELEASE_TAG -BinaryPath '${{ matrix.binary }}'
      - name: Package binary
        shell: pwsh
        run: ./scripts/release/Package-ReleaseBinary.ps1 -BinaryPath '${{ matrix.binary }}' -ArchivePath "release-assets/modelvault-$env:RELEASE_TAG-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: modelvault-${{ matrix.target }}
          path: release-assets/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: modelvault-*
          merge-multiple: true
          path: release-assets
      - name: Create or update GitHub Release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./scripts/release/Publish-ReleaseAssets.ps1 -ReleaseTag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY -AssetPaths (Get-ChildItem release-assets -Filter '*.zip' | Select-Object -ExpandProperty FullName) -CreateRelease
      - name: Download published archives and create verification assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./scripts/release/Create-ReleaseVerificationAssets.ps1 -ReleaseTag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
      - name: Upload checksums and signature bundles
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./scripts/release/Publish-ReleaseAssets.ps1 -ReleaseTag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY -AssetPaths (Get-ChildItem published-assets | Where-Object { $_.Name -eq 'SHA256SUMS' -or $_.Name.EndsWith('.sigstore.json') } | Select-Object -ExpandProperty FullName)
      - name: Smoke-test published Linux archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./scripts/release/Smoke-TestPublishedRelease.ps1 -ReleaseTag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY
