name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '19 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pirafrank/audit-check-action@v1

  semgrep:
    name: Semgrep static analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto --metrics off
