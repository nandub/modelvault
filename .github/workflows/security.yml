name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '19 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a54c7afa936fefeb4456b2dd8068152669aa8203 # v1
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0258
          --ignore RUSTSEC-2026-0098
          --ignore RUSTSEC-2026-0099
          --ignore RUSTSEC-2026-0104
        # Optional AWS S3 currently retains aws-smithy-http-client 1.4.0,
        # which requires the vulnerable pre-0.4 h2/rustls-webpki line. Review
        # and remove these exceptions when AWS publishes a compatible fix.

  semgrep:
    name: Semgrep static analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:155f999d01d02b33aa5a8db9186eb20dcd0154ce1a0ac6fce8d80674d0ace235
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/rust --metrics off
